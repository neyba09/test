services:
  app:
    build:
      context: ./docker/
      dockerfile: Dockerfile
    env_file:
      - .env
    image: php:8.4-fpm
    container_name: laravel_app
    volumes:
      - ./:/var/www
    networks:
      - laravel
    depends_on:
      - postgres
      - rabbitmq
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: on-failure
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro  # только твой конфиг
    networks:
      - laravel
    depends_on:
      - app

  postgres:
    image: postgres:15
    container_name: laravel_db
    restart: always
    environment:
      POSTGRES_DB: task_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - laravel

  rabbitmq:
    image: rabbitmq:3-management
    container_name: laravel_rabbitmq
    restart: always
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # веб-UI
    environment:
      RABBITMQ_DEFAULT_USER: $RABBITMQ_USER
      RABBITMQ_DEFAULT_PASS: $RABBITMQ_PASS
    networks:
      - laravel

volumes:
  db_data:

networks:
  laravel:
    driver: bridge
